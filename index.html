    background-size:cover; background-position:center;
    opacity:0; animation:coverIn .8s ease forwards;
    box-shadow:0 8px 30px rgba(20,20,40,0.08);
  }
  .cover-scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.18) 100%); }

  .page{ position:relative; z-index:1; max-width:440px; margin:0 auto; padding:0 18px 46px; text-align:center; }

  .profile-pic{
    width:104px; height:104px; border-radius:50%; background:#fff; margin:-52px auto 16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 28px rgba(20,20,40,0.15), 0 0 0 6px var(--off-white);
    opacity:0; transform:translateY(8px) scale(0.94);
    animation:profileIn .7s .18s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .profile-pic img{ width:82%; height:82%; object-fit:contain; border-radius:50%; }

  .brand-name{
    font-family:'Outfit', sans-serif; font-weight:800; font-size:25px; letter-spacing:0.01em; margin:0 0 6px;
    opacity:0; transform:translateY(8px); animation:fadeUp .6s .32s ease forwards;
  }
  .tagline{
    color:var(--muted); font-size:14px; line-height:1.5; margin:0 auto 26px; max-width:300px;
    opacity:0; transform:translateY(8px); animation:fadeUp .6s .4s ease forwards;
  }

  .group{
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    border-radius:24px;
    padding:6px 6px 10px;
    box-shadow:0 10px 28px rgba(20,20,40,0.05), inset 0 1px 0 rgba(255,255,255,0.6);
    margin-bottom:20px;
    text-align:left;
    opacity:0; transform:translateY(10px); animation:fadeUp .55s ease forwards;
  }
  .group-title{
    font-family:'Outfit', sans-serif; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.07em;
    color:#9a9aa0; margin:14px 16px 6px;
  }
  .row{
    display:flex; align-items:center; gap:13px; padding:11px 12px; margin:0 4px;
    text-decoration:none; color:var(--ink); border-radius:16px;
    transition:background .15s ease, transform .12s ease;
  }
  .row:active{ background:rgba(0,0,0,0.035); transform:scale(0.98); }
  @media (hover:hover){ .row:hover{ background:rgba(0,0,0,0.025); } }
  .row-list > .row + .row{ border-top:1px solid rgba(20,20,40,0.055); }

  .badge{
    flex:0 0 auto; width:44px; height:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.55);
    backdrop-filter:blur(12px) saturate(160%);
    -webkit-backdrop-filter:blur(12px) saturate(160%);
    border:1px solid rgba(255,255,255,0.75);
    box-shadow:0 3px 9px rgba(20,20,40,0.07), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .badge svg{ width:21px; height:21px; }

  .row-text{ text-align:left; flex:1; min-width:0; }
  .row-name{ font-weight:600; font-size:14.5px; }
  .row-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-chevron{ flex:0 0 auto; opacity:.5; }

  .maps-card{
    display:block; text-decoration:none; color:#fff; position:relative;
    border-radius:22px; overflow:hidden; height:140px; margin:0 4px 10px;
    box-shadow:0 12px 28px rgba(20,20,40,0.1);
  }
  .maps-visual{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), transparent 45%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.35) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 1px, transparent 1px 28px),
      linear-gradient(135deg,#eef2ff,#ffe9d6);
  }
  .maps-pin{ position:absolute; top:38%; left:50%; transform:translate(-50%,-50%); width:46px; height:46px; }
  .maps-overlay{
    position:absolute; left:0; right:0; bottom:0; padding:14px 16px;
    background:linear-gradient(180deg, rgba(20,20,40,0) 0%, rgba(20,20,40,0.55) 100%);
    display:flex; align-items:flex-end; justify-content:space-between; gap:10px;
  }
  .maps-name{ font-family:'Outfit',sans-serif; font-weight:700; font-size:15.5px; }
  .maps-cta{ font-size:11.5px; opacity:.9; display:flex; align-items:center; gap:4px; margin-top:2px; }

  footer{ margin-top:8px; font-size:11.5px; color:#b3b3b8; letter-spacing:0.02em;
    opacity:0; animation:fadeUp .6s .1s ease forwards; animation-delay:.55s; }

  @keyframes coverIn{ from{ opacity:0; transform:scale(1.03); } to{ opacity:1; transform:scale(1); } }
  @keyframes profileIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion: reduce){
    .cover, .profile-pic, .brand-name, .tagline, .group, footer{ animation:none !important; opacity:1 !important; transform:none !important; }
  }
</style>

function renderRow(link, forcedIcon){
  const a = document.createElement('a');
  a.className = 'row';
  a.href = link.url;
  if (/^https?:/i.test(link.url)){ a.target = '_blank'; a.rel = 'noopener'; }
  const iconKey = forcedIcon || link.platform;
  const svg = GICONS[iconKey] || GICONS.custom;
  a.innerHTML =
    '<span class="badge">' + svg + '</span>' +
    '<span class="row-text"><div class="row-name">' + link.label + '</div>' +
    (link.subtitle ? '<div class="row-sub">' + link.subtitle + '</div>' : '') + '</span>' +
    '<span class="row-chevron">' + CHEVRON + '</span>';
  a.addEventListener('click', function(){ logClick(link.label); });
  return a;
}

      }
    }

    if (content){
      if (content.tagline){ document.getElementById('tagline').textContent = content.tagline; }
      if (content.theme_primary){ document.documentElement.style.setProperty('--accent1', content.theme_primary); }
      if (content.theme_accent){ document.documentElement.style.setProperty('--accent2', content.theme_accent); }
      if (content.bg_image_url){
        document.getElementById('cover').style.backgroundImage = "url('" + content.bg_image_url + "')";
      }
    }
  }catch(e){ console.error('Supabase load error', e); }
})();
</script>
</body>
</html>
